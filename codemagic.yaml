workflows:
  react-native-ios:
    name: EGCHAT iOS Production
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic AppManager
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.jallzstores.egchat
      vars:
        XCODE_WORKSPACE: "egchat-mobile/ios/EGCHAT.xcworkspace"
        XCODE_SCHEME: "EGCHAT"
        APP_STORE_APPLE_ID: "6810877584"
        BUNDLE_ID: "com.jallzstores.egchat"
      node: v18.20.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          cd egchat-mobile && npm ci
      - name: Generate iOS project with Expo prebuild
        script: |
          cd egchat-mobile && npx expo prebuild --platform ios --clean
          cp Podfile.custom ios/Podfile
      - name: Install CocoaPods dependencies
        script: |
          cd egchat-mobile/ios && pod install --repo-update
      - name: Patch fmt for Xcode 26
        script: |
          FMT_DIR="egchat-mobile/ios/Pods/fmt/include/fmt"
          if [ -f "$FMT_DIR/base.h" ]; then
            sed -i '' 's/#elif defined(__cpp_consteval)/#elif 0 \/\/ disabled/g' "$FMT_DIR/base.h"
            sed -i '' 's/#  define FMT_USE_CONSTEVAL 1/#  define FMT_USE_CONSTEVAL 0/g' "$FMT_DIR/base.h"
            echo "✅ base.h patched"
          fi
          if [ -f "$FMT_DIR/format-inl.h" ]; then
            sed -i '' 's/FMT_STRING(/(/g' "$FMT_DIR/format-inl.h"
            echo "✅ format-inl.h patched"
          fi
      - name: Set up provisioning profiles settings on Xcode project
        script: |
          cd egchat-mobile && xcode-project use-profiles
      - name: Increment build number
        script: |
          cd egchat-mobile/ios
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID")
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Build ipa for distribution
        script: |
          cd egchat-mobile && xcode-project build-ipa \
            --workspace "ios/EGCHAT.xcworkspace" \
            --scheme "EGCHAT"
    artifacts:
      - egchat-mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - patron.bernardo111@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
