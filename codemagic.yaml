workflows:
  react-native-ios:
    name: EGCHAT iOS Production
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic AppManager
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.jallzstores.egchat
      vars:
        XCODE_WORKSPACE: "egchat-mobile/ios/EGCHAT.xcworkspace"
        XCODE_SCHEME: "EGCHAT"
        APP_STORE_APPLE_ID: "6810877584"
        BUNDLE_ID: "com.jallzstores.egchat"
      node: v18.20.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          cd egchat-mobile && npm ci
      - name: Install CocoaPods dependencies
        script: |
          cd egchat-mobile/ios && pod install --repo-update
      - name: Fix fmt library for Xcode 16
        script: |
          FMT_FORMAT="egchat-mobile/ios/Pods/fmt/include/fmt/core.h"
          FMT_FORMAT2="egchat-mobile/ios/Pods/fmt/include/fmt/format.h"
          if [ -f "$FMT_FORMAT" ]; then
            # Replace FMT_CONSTEVAL with constexpr to fix Xcode 16 compilation
            sed -i '' 's/FMT_CONSTEVAL/constexpr/g' "$FMT_FORMAT"
            echo "✅ fmt core.h patched"
          fi
          if [ -f "$FMT_FORMAT2" ]; then
            sed -i '' 's/FMT_CONSTEVAL/constexpr/g' "$FMT_FORMAT2"
            echo "✅ fmt format.h patched"
          fi
          # Also patch the source file
          FMT_SRC="egchat-mobile/ios/Pods/fmt/src/format.cc"
          if [ -f "$FMT_SRC" ]; then
            sed -i '' 's/FMT_CONSTEVAL/constexpr/g' "$FMT_SRC"
            echo "✅ fmt format.cc patched"
          fi
          # List all fmt headers
          find egchat-mobile/ios/Pods/fmt -name "*.h" -o -name "*.cc" 2>/dev/null | while read f; do
            sed -i '' 's/FMT_CONSTEVAL/constexpr/g' "$f"
          done
          echo "✅ All fmt files patched"      - name: Set up provisioning profiles settings on Xcode project
        script: |
          cd egchat-mobile && xcode-project use-profiles
      - name: Increment build number
        script: |
          cd egchat-mobile/ios
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID")
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Build ipa for distribution
        script: |
          cd egchat-mobile && xcode-project build-ipa \
            --workspace "ios/EGCHAT.xcworkspace" \
            --scheme "EGCHAT"
    artifacts:
      - egchat-mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - patron.bernardo111@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
